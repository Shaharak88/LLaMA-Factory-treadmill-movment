<!DOCTYPE html>
<html>
<head>
    <title>Sampler Comparison Matrix</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f5f5f5; }
        h1 { color: #333; text-align: center; }
        table { border-collapse: collapse; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; margin: 0 auto; }
        th { background-color: #4a5568; color: white; padding: 14px 16px; text-align: center; font-weight: 600; }
        th.sampler-header { text-align: left; min-width: 220px; }
        td { padding: 14px 16px; border-bottom: 1px solid #e2e8f0; text-align: center; font-weight: 700; font-size: 1.2em; }
        td.sampler-name { text-align: left; background-color: #f7fafc; font-weight: 600; }
        td.score { color: #000; text-shadow: 1px 1px 0px rgba(255,255,255,0.5); }
        tr:hover td.sampler-name { background-color: #edf2f7; }
        .missing { color: #a0aec0 !important; background-color: #f7fafc !important; font-style: italic; font-weight: normal; text-shadow: none !important; }
        .legend { text-align: center; margin: 20px 0; color: #666; }
        .gradient-bar { display: inline-block; width: 200px; height: 20px; background: linear-gradient(to right, rgb(220, 38, 38), rgb(250, 204, 21), rgb(34, 197, 94)); border-radius: 4px; vertical-align: middle; margin: 0 10px; }
    </style>
</head>
<body>
    <h1>Sampler Comparison - F1 Scores by Dataset</h1>
    <div class="legend">Worst <span class="gradient-bar"></span> Best</div>
    <table>
        <tr><th class="sampler-header">Sampler</th>
<th>64 distances</th><th>74=64 +10 distances</th><th>124=64 +60 distances</th></tr>
<tr><td class="sampler-name">HF shuffle</td><td class="score" style="background-color: rgb(67, 198, 82);">80.71</td><td class="score" style="background-color: rgb(225, 66, 35);">53.17</td><td class="score" style="background-color: rgb(223, 59, 35);">52.38</td></tr>
<tr><td class="sampler-name">Our random shuffle</td><td class="score" style="background-color: rgb(34, 197, 94);">83.28</td><td class="score" style="background-color: rgb(223, 59, 35);">52.38</td><td class="score" style="background-color: rgb(223, 59, 35);">52.38</td></tr>
<tr><td class="sampler-name">Our random shuffle (iter fix)</td><td class="score" style="background-color: rgb(67, 198, 82);">80.71</td><td class="score" style="background-color: rgb(220, 38, 38);">50.29</td><td class="score" style="background-color: rgb(223, 59, 35);">52.38</td></tr>
<tr><td class="sampler-name">Balanced</td><td class="score" style="background-color: rgb(241, 203, 23);">67.44</td><td class="score" style="background-color: rgb(223, 56, 36);">52.15</td><td class="score" style="background-color: rgb(113, 199, 67);">77.21</td></tr>
<tr><td class="sampler-name">No shuffle</td><td class="score" style="background-color: rgb(94, 198, 73);">78.64</td><td class="score" style="background-color: rgb(223, 59, 35);">52.38</td><td class="score" style="background-color: rgb(172, 201, 47);">72.67</td></tr>
</table></body></html>
